[package]
name = "soteria-engine"
version = "1.0.0"
edition = "2021"
description = "WASM matching engine for Soteria browser extension"
license = "MIT"
repository = "https://github.com/Yushi5058/soteria"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
aho-corasick = "1"
once_cell = "1"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
